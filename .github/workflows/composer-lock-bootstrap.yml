# One-time, narrowly-scoped promotion of the PHP 8.3 lockfile validated by CI 38805803519.
# Remove this bootstrap workflow after the lockfile is committed.
name: Promote verified Composer lock
on:
  push:
    branches: [chatgpt/phase0-foundation]
    paths: [.github/workflows/composer-lock-bootstrap.yml]
permissions:
  actions: read
  contents: write
jobs:
  promote-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve lock from verified PHP 8.3 run
        uses: actions/download-artifact@v4
        with:
          name: composer-lock-php83
          run-id: 38805803519
          github-token: ${{ github.token }}
          path: backend
      - name: Check exact reviewed artifact contents
        shell: bash
        run: |
          echo '2952e25b1e7befaf6c22c8a14b84a78eb588b1d0db2aad75ba7f14973923fe3d  backend/composer.lock' | sha256sum -c -
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Validate and install locked dependencies
        working-directory: backend
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
      - name: Commit ONLY lock file to original branch (never force)
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/chatgpt/phase0-foundation'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/composer.lock
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'build: commit validated PHP 8.3 Composer dependency lock'
          git push origin HEAD:refs/heads/chatgpt/phase0-foundation
