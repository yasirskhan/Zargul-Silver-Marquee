name: Phase 0 validation
on:
  push:
    branches:
      - chatgpt/phase0-foundation
  pull_request:
jobs:
  prototype-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node prototype tests
        run: npm test
      - name: Verify project continuity files
        shell: bash
        run: |
          test -s AI_HANDOFF.md
          test -s docs/PROJECT_MASTER_SPEC.md
          test -s docs/FEATURE_REGISTER.csv
          test -s docs/ROADMAP.md
          test -s assets/core.mjs
          test -s tests/core.test.mjs
          test -s tests/ui.test.mjs
          test -s index.html
          test -s admin.html
          test -s assets/styles.css
          test -s assets/site.mjs
          test -s assets/admin.mjs
          test -s assets/cms-schema.mjs
          test -s tests/cms-schema.test.mjs
          test -s tests/website-editor.test.mjs
          test -s website-editor.html
          test -s assets/website-editor.mjs
          test -s assets/editor.css
          test -s docs/decisions/ADR-0001-platform-and-cms.md
          test -s docs/WEBSITE_CMS_DESIGN.md
          test -s docs/DEVELOPMENT_PROTOCOL.md
      - name: Check JS syntax
        run: |
          node --check assets/core.mjs
          node --check assets/site.mjs
          node --check assets/admin.mjs
          node --check assets/cms-schema.mjs
          node --check assets/website-editor.mjs

  laravel-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Validate PHP dependency manifest
        run: composer validate --no-check-publish
      - name: Install reproducible locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare isolated CI environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Verify PHP source syntax
        run: |
          find app bootstrap database routes tests public -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l artisan
      - name: Run PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
        run: php artisan migrate --force --no-interaction
      - name: Run tenant-isolation backend tests
        run: php artisan test --no-ansi
      - name: Verify CMS, MFA and shared cache/session migration rollback and replay
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
        run: |
          php artisan migrate:rollback --step=3 --force --no-interaction
          php artisan migrate --force --no-interaction


  editor-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise public website editor prototype in desktop and phone browsers
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser diagnostics if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
