name: Phase 0 validation
on:
  push:
    branches:
      - chatgpt/phase0-foundation
  pull_request:
jobs:
  prototype-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node prototype tests
        run: npm test
      - name: Verify project continuity files
        shell: bash
        run: |
          test -s AI_HANDOFF.md
          test -s docs/PROJECT_MASTER_SPEC.md
          test -s docs/FEATURE_REGISTER.csv
          test -s docs/ROADMAP.md
          test -s assets/core.mjs
          test -s tests/core.test.mjs
          test -s tests/ui.test.mjs
          test -s index.html
          test -s admin.html
          test -s assets/styles.css
          test -s assets/site.mjs
          test -s assets/admin.mjs
          test -s assets/cms-schema.mjs
          test -s tests/cms-schema.test.mjs
          test -s tests/website-editor.test.mjs
          test -s website-editor.html
          test -s assets/website-editor.mjs
          test -s assets/editor.css
          test -s docs/decisions/ADR-0001-platform-and-cms.md
          test -s docs/WEBSITE_CMS_DESIGN.md
          test -s docs/DEVELOPMENT_EFFICIENCY.md
          test -s docs/QUALITY_AND_BUG_REMEDIATION_POLICY.md
          test -s docs/ISSUE_AND_BUG_REGISTER.md
          test -s docs/AI_HANDOFF_ARCHIVE_2026-10-18.md
          test -s docs/DEVELOPMENT_PROTOCOL.md
      - name: Check JS syntax
        run: |
          node --check assets/core.mjs
          node --check assets/site.mjs
          node --check assets/admin.mjs
          node --check assets/cms-schema.mjs
          node --check assets/website-editor.mjs

  central-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CENTRAL_DB_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=hafzatech_central_test"
      CENTRAL_DB_USERNAME: venue
      CENTRAL_DB_PASSWORD: venue
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, sodium
          coverage: none
      - name: Provision isolated HAFZATECH PostgreSQL test database
        run: |
          php -r '$db = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres", "venue", "venue", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("CREATE DATABASE hafzatech_central_test");'
      - name: Validate central PHP and isolated migrations
        run: |
          find central -name '*.php' -print0 | xargs -0 -n1 php -l
          php central/bin/migrate.php
      - name: Verify central cross-customer and licensing tests
        run: |
          php central/tests/installation_http_policy.php
          php central/tests/installation_identity.php
          php central/tests/staff_permissions.php
          php central/tests/staff_access.php
          php central/tests/staff_totp.php
          php central/tests/staff_mfa_state.php
          php central/tests/staff_mfa_audit_reader.php
          php central/tests/staff_password.php
          php central/tests/staff_credentials.php
          php central/tests/staff_sessions.php
          php central/tests/staff_login_throttle.php
          php central/tests/staff_http_policy.php
          php central/tests/staff_session_authorization.php
          php central/tests/staff_http_boundary.php
          php central/tests/staff_response_emitter.php
          php central/tests/staff_operator_wiring.php
          php central/tests/staff_public_portal.php
          php central/tests/staff_portal_journey.php
          php central/tests/staff_session_audit_reader.php
          php central/tests/staff_suspension.php
          php central/tests/staff_authenticated_mfa_history.php
          php central/tests/staff_account_action_reader.php
          php central/tests/staff_provisioning.php
          php central/tests/staff_identity_attestation.php
          php central/tests/staff_enrollment_challenge.php
          php central/tests/staff_enrollment_evidence.php
          php central/tests/staff_enrollment_audit_reader.php
          php central/tests/staff_role_requests.php
          php central/tests/staff_own_password_change.php
          php central/tests/staff_password_change_audit_reader.php
          php central/tests/vendor_receiving_directory.php
          php central/tests/payment_eligibility.php
          php central/tests/staff_vendor_invoice_issuance.php
          php central/tests/staff_vendor_plan_publisher.php
          php central/tests/domain_ownership.php
          php central/tests/license_term_calendar.php
          php central/tests/grant_signature_codec.php
          php central/tests/paid_license_preparation.php
          php central/tests/installation_status.php
          php central/tests/installation_signed_status.php
          php central/tests/support_ticket_ingress.php
          php central/tests/support_agent_reply.php
          php central/tests/support_reply_pull.php
          php central/tests/support_reply_page_codec.php
          php central/tests/status_receipt_codec.php
          php central/tests/staff_paid_license_preparation.php
          php central/tests/vendor_verified_reversals.php

  licensing-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Cache Composer download archives by lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-php83-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - name: Install locked dependencies and isolated test key
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Run focused central, support and private overview authorization regressions
        run: php artisan test --no-ansi --exclude-group=phase9-finance-process --filter='Central.*Test|VenueOverviewLivewireTest'

  laravel-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Validate PHP dependency manifest
        run: composer validate --no-check-publish
      - name: Cache Composer download archives by lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-php83-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - name: Install reproducible locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare isolated CI environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Verify PHP source syntax
        run: |
          find app bootstrap database routes tests public -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l artisan
      - name: Compile all Blade templates before database tests
        run: php artisan view:cache --no-interaction
      - name: Reject malformed PHP names in Blade page links
        run: |
          if grep -R -n -E 'AppFilamentPages[A-Z]' resources/views; then
            echo "::error::Blade contains a missing fully qualified Filament PHP class namespace"
            exit 1
          fi
      - name: Run PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
        run: php artisan migrate --force --no-interaction
      - name: Run tenant-isolation backend tests
        run: php artisan test --no-ansi --exclude-group=phase9-finance-process
      - name: Create isolated finance certification database
        env:
          PGPASSWORD: venue
        run: createdb -h 127.0.0.1 -U venue venue_finance_test
      - name: Migrate isolated finance database once
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_finance_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
        run: php artisan migrate --force --no-interaction
      - name: Certify competing financial deposits
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_finance_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
          VENUE_INVOICE_ISSUANCE_ENABLED: 'true'
          VENUE_INVOICE_APPROVED_TAX_BPS: '0'
          VENUE_CUSTOMER_PAYMENT_ENABLED: 'true'
          VENUE_FINANCE_POSTING_ENABLED: 'true'
        run: php vendor/bin/phpunit -c phpunit.finance.xml --group=phase9-finance-process

      - name: Verify CMS, MFA and shared cache/session migration rollback and replay
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: venue_test
          DB_USERNAME: venue
          DB_PASSWORD: venue
        run: |
          php artisan migrate:rollback --step=3 --force --no-interaction
          php artisan migrate --force --no-interaction


  editor-browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache pinned Playwright npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-1.56.1
      - name: Install pinned Playwright test tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Cache pinned Playwright Chromium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-playwright-${{ runner.os }}-1.56.1
      # Playwright invokes apt-get update; the hosted runner sometimes ships
      # a third-party Microsoft feed that answers 403 and aborts browser setup.
      # Chromium acceptance must still install and execute, not be skipped.
      - name: Isolate failing optional Microsoft APT feed on hosted runner
        run: |
          sudo mkdir -p /tmp/venuedesk-disabled-apt-feeds
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -l 'packages.microsoft.com' {} + | while IFS= read -r source; do
              sudo mv "$source" /tmp/venuedesk-disabled-apt-feeds/
            done
      - name: Install Chromium browser and dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise public website editor prototype in desktop and phone browsers
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser diagnostics if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  authenticated-panel-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      BROWSER_E2E_SEED: '1'
      LOG_CHANNEL: 'single'
      VENUE_CENTRAL_ACTIVATION_ENABLED: 'true'
      VENUE_CENTRAL_MANUAL_CHECKS_ENABLED: 'true'
      VENUE_PUBLIC_SITE_ENABLED: 'true'
      VENUE_PUBLIC_SITE_HOST: 'wizard.localhost'
      VENUE_PUBLIC_SITE_TEST_FALLBACK: 'true'
      VENUE_CENTRAL_BASE_URL: 'http://127.0.0.1:9001'
      CENTRAL_LOCAL_STATUS_TEST: 'true'
      # Isolated CI-only finance posting for synthetic cash closeout acceptance.
      # Config defaults and production remain OFF.
      VENUE_FINANCE_POSTING_ENABLED: 'true'
      # Isolated CI-only inventory release. Config defaults / production remain OFF.
      VENUE_INVENTORY_CATALOG_ENABLED: 'true'
      VENUE_INVENTORY_POSITION_REPORTS_ENABLED: 'true'
      VENUE_INVENTORY_STOCKTAKES_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_DRAFTS_ENABLED: 'true'
      VENUE_INVENTORY_OPENING_POSTING_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_DISPATCH_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_RECEIPT_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_RETURNS_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_RETURN_ACCEPTANCE_ENABLED: 'true'
      VENUE_INVENTORY_INTERNAL_DISCREPANCY_ENABLED: 'true'
      # Test-only staged source incident and immutable physical finding review.
      VENUE_INVENTORY_LOAN_INCIDENTS_ENABLED: 'true'
      VENUE_INVENTORY_LOAN_INCIDENT_REVIEWS_ENABLED: 'true'
      VENUE_INVENTORY_INTERNAL_PHYSICAL_FINDING_ENABLED: 'true'
      # CI-only ADR-0009 Option A guarded financial and numbered IAC acceptance.
      VENUE_INVENTORY_INTERNAL_LOSS_OBLIGATION_ENABLED: 'true'
      VENUE_INVENTORY_INTERNAL_LOSS_SETTLEMENT_ENABLED: 'true'
      VENUE_INVENTORY_INTERNAL_ABNORMAL_WRITEOFF_ENABLED: 'true'
      VENUE_INVENTORY_INTERNAL_ABNORMAL_CLOSURE_ENABLED: 'true'
      # EXTERNAL_IN signed physical custody tests, restricted to isolated CI.
      VENUE_INVENTORY_EXTERNAL_BORROWED_INTAKE_ENABLED: 'true'
      VENUE_INVENTORY_EXTERNAL_BORROWED_RETURN_ENABLED: 'true'
      VENUE_INVENTORY_EXTERNAL_BORROWED_CLEAN_CLOSURE_ENABLED: 'true'
      # Signed owned EXTERNAL_OUT lending and separate physical condition review, CI only.
      VENUE_INVENTORY_EXTERNAL_OUT_DISPATCH_ENABLED: 'true'
      VENUE_INVENTORY_EXTERNAL_OUT_RETURN_ENABLED: 'true'
      # CI-only purchase and monthly count evidence, not payment or stock posting.
      VENUE_INVENTORY_PURCHASE_RECEIPTS_ENABLED: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: venue_test
      DB_USERNAME: venue
      DB_PASSWORD: venue
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, zip, bcmath, gd
          coverage: none
          tools: composer:v2
      - name: Cache Composer download archives by lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-php83-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - name: Install exact PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Create isolated synthetic MFA owner and proposal
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan filament:assets --no-interaction
          php artisan venuedesk:seed-browser-e2e
      - name: Start isolated local central status endpoint
        run: |
          nohup env CENTRAL_LOCAL_STATUS_TEST=true php -S 127.0.0.1:9001 central/tests/local_status_server.php > /tmp/central-status.log 2>&1 </dev/null &
          sleep 2
          curl -s -o /dev/null http://127.0.0.1:9001/ || true

      - name: Start authenticated Laravel panel
        working-directory: backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/venuedesk-e2e-server.log 2>&1 </dev/null &
          for attempt in {1..40}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/admin/login; then exit 0; fi
            sleep 2
          done
          cat /tmp/venuedesk-e2e-server.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache pinned Playwright npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-1.56.1
      - name: Install pinned authenticated browser tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Cache pinned Playwright Chromium binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-playwright-${{ runner.os }}-1.56.1
      # Playwright invokes apt-get update; the hosted runner sometimes ships
      # a third-party Microsoft feed that answers 403 and aborts browser setup.
      # Chromium acceptance must still install and execute, not be skipped.
      - name: Isolate failing optional Microsoft APT feed on hosted runner
        run: |
          sudo mkdir -p /tmp/venuedesk-disabled-apt-feeds
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -l 'packages.microsoft.com' {} + | while IFS= read -r source; do
              sudo mv "$source" /tmp/venuedesk-disabled-apt-feeds/
            done
      - name: Install Chromium for authenticated acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser verify owner password TOTP and proposal editing
        run: npx playwright test --config=playwright.auth.config.mjs
      - name: Save synthetic Phase 12 desktop and mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-inventory-browser-evidence
          path: test-results/phase12-inventory-*.png
          if-no-files-found: ignore
      - name: Show application log on failed browser acceptance
        if: failure()
        run: |
          tail -n 120 /tmp/venuedesk-e2e-server.log || true
          if test -f backend/storage/logs/laravel.log; then
            echo "::group::Recent Laravel error headers (synthetic test environment)"
            grep -E 'testing.ERROR|local.ERROR|production.ERROR' backend/storage/logs/laravel.log | tail -n 10 | cut -c1-700 || true
            echo "::endgroup::"
            tail -n 100 backend/storage/logs/laravel.log
          fi
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-panel-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
